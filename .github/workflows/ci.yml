name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.12"]
        exclude:
          # На macOS-раннерах (Apple Silicon) сборок Python 3.9 нет —
          # 3.9 покрыт на Linux и Windows, здесь проверяем актуальные версии.
          - os: macos-latest
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests without watchdog (polling fallback)
        shell: bash
        run: |
          set -o pipefail
          python -m unittest test_organizer_core -v 2>&1 | tee "${RUNNER_TEMP}/unittest.log"

      - name: Install watchdog (event-based monitoring)
        run: pip install "watchdog>=2.0"

      - name: Tests with watchdog
        shell: bash
        run: |
          set -o pipefail
          python -m pytest test_organizer_core.py -q 2>&1 | tee "${RUNNER_TEMP}/pytest.log"

      # На Windows/macOS лог шага без этого пришлось бы искать глазами в вебе:
      # выносим имена упавших тестов в аннотации (их видно через API и в UI).
      # Имена упавших тестов выносим в аннотации (иначе на чужой ОС пришлось
      # бы искать их глазами), а итог прогона — в notice: видно, что именно
      # выполнялось и что было пропущено платформенными skip'ами.
      - name: Итог тестов в аннотациях
        if: always()
        shell: bash
        run: |
          emit() {
            while IFS= read -r line; do
              echo "::error title=CI failure::${line}"
            done
          }
          notice() {
            while IFS= read -r line; do
              echo "::notice title=${{ matrix.os }} py${{ matrix.python-version }}::${line}"
            done
          }
          for log in "${RUNNER_TEMP}/unittest.log" "${RUNNER_TEMP}/pytest.log"; do
            [ -f "$log" ] || continue
            echo "--- ${log} ---"
            grep -hE "^(FAIL|ERROR): |^FAILED " "$log" | sort -u | head -10 | emit
            grep -hE "AssertionError|Error: " "$log" | sort -u | head -5 | emit
            grep -hE "^(Ran [0-9]+ tests|OK|FAILED|[0-9]+ (passed|failed))" "$log" | sort -u | head -3 | notice
          done
          exit 0

  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy watchdog

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy . --config-file pyproject.toml

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage

      - name: Run coverage
        run: |
          coverage run --source=organizer_core -m unittest test_organizer_core
          coverage report -m
